<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estació de terra Kaiper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --navy:#0a1220; --deep:#0d1b2e; --teal:#123647; --ice:#8fd9e8; --ice-soft:#c9edf3; --foam:#eef8f8; --coral:#ff6f4d; --line:rgba(143,217,232,0.18); }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:var(--navy); color:var(--foam); font-family:'Inter','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif; line-height:1.55; }
  h1,h2,.num{ font-family:'Space Grotesk','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif; }
  .wrap{ max-width:1100px; margin:0 auto; padding:1.6rem 5vw 4rem; }
  .top{ display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap:0.6rem; font-family:'Space Grotesk',sans-serif; font-weight:700; letter-spacing:0.02em; }
  .brand img{ width:26px; height:26px; object-fit:contain; }
  .langs button{ background:transparent; color:var(--ice-soft); border:1px solid var(--line); padding:0.3rem 0.65rem; border-radius:999px; cursor:pointer; font:500 0.8rem 'Inter',sans-serif; margin-left:0.3rem; }
  .langs button[aria-pressed="true"]{ color:var(--navy); background:var(--ice); border-color:var(--ice); }
  h1{ font-size:clamp(1.7rem,4vw,2.4rem); margin-top:1.6rem; font-weight:600; }
  .sub{ color:var(--ice-soft); max-width:640px; margin-top:0.5rem; }

  .bar{ display:flex; flex-wrap:wrap; gap:0.6rem; margin-top:1.6rem; }
  .btn{ background:transparent; color:var(--foam); border:1px solid var(--line); border-radius:8px; padding:0.6rem 1rem; cursor:pointer; font:500 0.9rem 'Inter',sans-serif; }
  .btn:hover{ border-color:var(--ice); }
  .btn.main{ background:var(--coral); border-color:var(--coral); color:#1a0b06; font-weight:600; }
  .btn.main.on{ background:transparent; color:var(--coral); }
  .btn[disabled]{ opacity:0.4; cursor:not-allowed; }
  .status{ margin-top:0.9rem; font-size:0.9rem; color:var(--ice-soft); display:flex; align-items:center; gap:0.5rem; }
  .dot{ width:9px; height:9px; border-radius:50%; background:#6f8a96; }
  .dot.live{ background:#39ff6a; box-shadow:0 0 8px #39ff6a; }
  .dot.err{ background:var(--coral); }

  .stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); margin-top:1.6rem; }
  .stat{ background:var(--deep); padding:1rem 1.1rem; }
  .stat .k{ font-size:0.78rem; color:var(--ice-soft); }
  .stat .num{ font-size:1.7rem; font-weight:600; margin-top:0.1rem; }
  .stat.hot .num{ color:var(--coral); }

  .chartbox{ margin-top:1.4rem; border:1px solid var(--line); border-radius:12px; padding:1rem 1rem 0.8rem; background:rgba(13,27,46,0.6); }
  .chartbox svg{ width:100%; height:auto; display:block; }
  .legend{ display:flex; flex-wrap:wrap; gap:1.2rem; font-size:0.82rem; color:var(--ice-soft); margin-top:0.4rem; }
  .legend i{ display:inline-block; width:18px; height:3px; margin-right:0.45rem; vertical-align:middle; border-radius:2px; }
  .opts{ display:flex; flex-wrap:wrap; gap:1.4rem; margin-top:1rem; font-size:0.85rem; color:var(--ice-soft); align-items:center; }
  .opts input, .opts select{ background:var(--deep); color:var(--foam); border:1px solid var(--line); border-radius:6px; padding:0.3rem 0.5rem; font:inherit; width:4.4rem; }
  .opts select{ width:auto; }

  .cols{ display:grid; grid-template-columns:1fr 1fr; gap:1.4rem; margin-top:1.6rem; }
  @media (max-width:760px){ .cols{ grid-template-columns:1fr; } }
  .panel{ border:1px solid var(--line); border-radius:12px; padding:1rem 1.1rem; }
  .panel h2{ font-size:1rem; font-weight:600; margin-bottom:0.6rem; }
  table{ width:100%; border-collapse:collapse; font-size:0.88rem; }
  th,td{ text-align:left; padding:0.3rem 0.4rem; border-bottom:1px solid var(--line); }
  th{ color:var(--ice-soft); font-weight:500; }
  .scroll{ max-height:220px; overflow:auto; }
  .logline{ font-family:ui-monospace,Menlo,Consolas,monospace; font-size:0.8rem; color:var(--ice-soft); padding:0.15rem 0; border-bottom:1px solid var(--line); word-break:break-word; }
  .empty{ color:#6f8a96; font-size:0.85rem; }
  .tips{ margin-top:1.6rem; border-left:3px solid var(--coral); padding:0.4rem 1rem; color:var(--ice-soft); font-size:0.88rem; }
  .tips strong{ color:var(--foam); }
  .tips li{ margin-left:1.1rem; margin-top:0.25rem; }
  .note{ margin-top:0.5rem; font-size:0.8rem; color:#6f8a96; }
  body.embedded h1, body.embedded .sub{ display:none; }
  body.embedded .wrap{ padding-top:0.8rem; }
</style>
</head>

<div class="wrap">
  <div class="top">
    <div class="brand"><img src="images/isotipo.png" alt="" onerror="this.style.display='none'">KAIPER</div>

    <button class="btn" id="bSD" type="button" data-i="open_sd"></button>

    <button class="btn" id="bRaw" type="button" data-i="dl_raw" disabled></button>
    <button class="btn" id="bClear" type="button" data-i="clear" disabled></button>
  </div>
  <div class="status"><span class="dot" id="dot"></span><span id="statusTxt"></span></div>

  <div class="stats">
    <div class="stat hot"><div class="k" data-i="s_last"></div><div class="num" id="sLast">-</div></div>
    <div class="stat"><div class="k" data-i="s_avg"></div><div class="num" id="sAvg">-</div></div>
    <div class="stat"><div class="k" data-i="s_min"></div><div class="num" id="sMin">-</div></div>
    <div class="stat"><div class="k" data-i="s_max"></div><div class="num" id="sMax">-</div></div>
    <div class="stat"><div class="k" data-i="s_count"></div><div class="num" id="sCount">0</div></div>

  <div class="chartbox">
    <div id="chart"></div>
    <div class="legend">
      <span><i style="background:#8fd9e8"></i><span data-i="leg_temp"></span></span>
      <span><i style="background:#ff6f4d"></i><span data-i="leg_ma"></span></span>
      <span><i style="background:#eef8f8;opacity:.7"></i><span data-i="leg_avg"></span></span>
    </div>
    <div class="opts">
      <label><span data-i="opt_window"></span> <input type="number" id="oWin" min="2" max="100" value="10"></label>
      <label><span data-i="opt_col"></span> <input type="number" id="oCol" min="1" max="30" value="1"></label>
      <label><span data-i="opt_team"></span> <input type="text" id="oTeam" maxlength="8" placeholder="KAI" style="width:5.5rem"></label>
      <label><span data-i="opt_view"></span> <select id="oView"><option value="all" data-i="view_all"></option><option value="60" data-i="view_60"></option></select></label>
    </div>
  </div>

  <div class="cols">
    <div class="panel"><h2 data-i="tb_title"></h2><div class="scroll"><table><thead><tr><th data-i="tb_time"></th><th data-i="tb_temp"></th></tr></thead><tbody id="tbody"></tbody></table></div></div>
    <div class="panel"><h2 data-i="log_title"></h2><div class="scroll" id="log"></div></div>
  </div>

  <div class="tips">
    <strong data-i="tip_title"></strong>
    <ul><li data-i="tip1"></li><li data-i="tip2"></li><li data-i="tip3"></li><li data-i="tip4"></li></ul>
  </div>
  <p class="note" id="sdNote" hidden></p>
</div>

var LANG = 'ca';
function T(k){ return (I18N[LANG] && I18N[LANG][k] !== undefined) ? I18N[LANG][k] : I18N.ca[k]; }

/* ---------------- state ---------------- */
var S = { rows:[], raw:[], log:[], t0:null, port:null, reader:null, loop:null, demo:null, status:'idle', statusExtra:'', source:'radio', dirty:false };

/* ---------------- parsing and stats (pure) ---------------- */
/* A frame looks like  KAI;23.45;  (team letters first) or, later,  KAI;23.45;22.10;1013.2;...;15/3/27;10:05:07;
   col = which value after the team letters (1 = first value). Old frames without letters (23.45;) also work. */
function parseFrame(line, col){
  var tok = line.split(';').map(function(x){ return x.trim(); });
  while(tok.length && tok[tok.length - 1] === '') tok.pop();
  if(!tok.length) return null;
  var tag = '';
  if(/^[A-Za-z][A-Za-z0-9]{0,7}$/.test(tok[0])){ tag = tok[0]; tok = tok.slice(1); }
  else if(line.indexOf(';') < 0) return null;          // plain text message, not a data frame
  if(!tok.length || col > tok.length) return null;
  var one = tok[col - 1];
  if(!/^[+-]?\d+([.,]\d+)?$/.test(one)) return null;
  return { tag: tag, value: parseFloat(one.replace(',', '.')) };
}
function parseLine(line, col){ var f = parseFrame(line, col); return f ? f.value : null; }
function acceptFrame(f, team){
  if(!f) return false;
  if(team && f.tag.toUpperCase() !== team.toUpperCase()) return false;
  return true;
}
function movingAvg(vals, w){
  var out = [], sum = 0;
  for(var i = 0; i < vals.length; i++){
    sum += vals[i];
    if(i >= w) sum -= vals[i - w];
    out.push(sum / Math.min(i + 1, w));
  }
  return out;
}
function stats(rows){
  if(!rows.length) return null;
  var v = rows.map(function(r){ return r.v; });
  var sum = 0, mn = v[0], mx = v[0];
  for(var i = 0; i < v.length; i++){ sum += v[i]; if(v[i] < mn) mn = v[i]; if(v[i] > mx) mx = v[i]; }
  return { n:v.length, last:v[v.length - 1], avg:sum / v.length, min:mn, max:mx };
}
function niceStep(raw){ var p = Math.pow(10, Math.floor(Math.log10(raw))); var f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }
function fmt(x){ return (Math.round(x * 100) / 100).toFixed(2); }

/* ---------------- chart (inline SVG) ---------------- */
function chartSVG(rows, win, view){
  var W = 900, H = 380, L = 58, R = 18, Tp = 16, B = 50;
  var pw = W - L - R, ph = H - Tp - B;
  if(!rows.length){
    return '<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg"><text x="'+(W/2)+'" y="'+(H/2)+'" fill="#6f8a96" font-size="16" text-anchor="middle" font-family="Inter,sans-serif">'+T('ch_empty')+'</text></svg>';
  }
  var ma = movingAvg(rows.map(function(r){ return r.v; }), win);
  var st = stats(rows);
  var tmax = rows[rows.length - 1].t;
  var x0 = 0, x1 = Math.max(tmax, 10);
  if(view === '60'){ x1 = Math.max(tmax, 10); x0 = Math.max(0, x1 - 60); }
  var idx = []; for(var i = 0; i < rows.length; i++){ if(rows[i].t >= x0) idx.push(i); }
  var ymin = Infinity, ymax = -Infinity;
  idx.forEach(function(i){ ymin = Math.min(ymin, rows[i].v, ma[i]); ymax = Math.max(ymax, rows[i].v, ma[i]); });
  ymin = Math.min(ymin, st.avg); ymax = Math.max(ymax, st.avg);
  var span = Math.max(ymax - ymin, 2);
  var step = niceStep(span / 5);
  var lo = Math.floor((ymin - span * 0.08) / step) * step;
  var hi = Math.ceil((ymax + span * 0.08) / step) * step;
  function X(t){ return L + (t - x0) / (x1 - x0) * pw; }
  function Y(v){ return Tp + (1 - (v - lo) / (hi - lo)) * ph; }
  var g = '';
  for(var yv = lo; yv <= hi + 1e-9; yv += step){
    var yy = Y(yv).toFixed(1);
    g += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'" stroke="rgba(143,217,232,0.15)"/>';
    g += '<text x="'+(L-8)+'" y="'+(parseFloat(yy)+4)+'" fill="#c9edf3" font-size="12" text-anchor="end" font-family="Inter,sans-serif">'+(Math.round(yv*100)/100)+'</text>';
  }
  var xstep = niceStep((x1 - x0) / 6);
  for(var xv = Math.ceil(x0 / xstep) * xstep; xv <= x1 + 1e-9; xv += xstep){
    var xx = X(xv).toFixed(1);

var CRC_T = (function(){ var t = [], c; for(var n = 0; n < 256; n++){ c = n; for(var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); t[n] = c >>> 0; } return t; })();

  function u32(n){ return [n & 255, (n >> 8) & 255, (n >> 16) & 255, (n >>> 24) & 255]; }

    central.push(new Uint8Array(cen), name);
    offset += head.length + name.length + data.length;

/* ---------------- UI ---------------- */
function $(id){ return document.getElementById(id); }
function winVal(){ var v = parseInt($('oWin').value, 10); return (isNaN(v) || v < 2) ? 10 : Math.min(v, 100); }
function teamVal(){ return ($('oTeam').value || '').trim(); }
function colVal(){ var v = parseInt($('oCol').value, 10); return (isNaN(v) || v < 1) ? 1 : v; }

function setStatus(kind, extra){
  S.status = kind; S.statusExtra = extra || '';
  var key = {idle:'st_idle', live:'st_connected', demo:'st_demo', sd:'st_sd', unsupported:'st_unsupported', error:'st_error'}[kind];
  $('statusTxt').textContent = T(key) + (kind === 'error' ? S.statusExtra : '');
  $('dot').className = 'dot' + ((kind === 'live' || kind === 'demo') ? ' live' : (kind === 'error' || kind === 'unsupported') ? ' err' : '');
}

function render(){
  var st = stats(S.rows);
  $('sLast').textContent = st ? fmt(st.last) : '-';
  $('sAvg').textContent = st ? fmt(st.avg) : '-';
  $('sMin').textContent = st ? fmt(st.min) : '-';
  $('sMax').textContent = st ? fmt(st.max) : '-';
  $('sCount').textContent = st ? st.n : 0;
  $('chart').innerHTML = chartSVG(S.rows, winVal(), $('oView').value);
  var tb = '', from = Math.max(0, S.rows.length - 60);
  for(var i = S.rows.length - 1; i >= from; i--){ tb += '<tr><td>' + (Math.round(S.rows[i].t * 10) / 10) + '</td><td>' + fmt(S.rows[i].v) + '</td></tr>'; }
  $('tbody').innerHTML = tb;
  var lg = '';
  for(var j = S.log.length - 1; j >= Math.max(0, S.log.length - 40); j--){ lg += '<div class="logline"></div>'; }
  var logEl = $('log');
  if(!S.log.length){ logEl.innerHTML = '<div class="empty">' + T('log_empty') + '</div>'; }
  else { logEl.innerHTML = lg; var kids = logEl.children, k = 0; for(var m = S.log.length - 1; m >= Math.max(0, S.log.length - 40); m--){ kids[k++].textContent = S.log[m]; } }
  var has = S.rows.length > 0;
  $('bXlsx').disabled = !has; $('bRaw').disabled = !has && !S.raw.length; $('bClear').disabled = !has && !S.raw.length;
}

function addSample(v, t){ S.rows.push({t:t, v:v}); S.dirty = true; }
function handleLine(line){
  line = line.trim();
  if(!line) return;
  S.raw.push(line);
  var f = parseFrame(line, colVal());
  if(!acceptFrame(f, teamVal())){ S.log.push(line); }
  else { addSample(f.value, (Date.now() - S.t0) / 1000); }
  render();
}

function applyLang(l){
  LANG = I18N[l] ? l : 'ca';
  document.documentElement.lang = LANG;
  document.title = T('title');
  var els = document.querySelectorAll('[data-i]');
  for(var i = 0; i < els.length; i++){ els[i].textContent = T(els[i].getAttribute('data-i')); }
  $('bConnect').textContent = S.port ? T('disconnect') : T('connect');
  $('bDemo').textContent = S.demo ? T('demo_stop') : T('demo');
  var bs = document.querySelectorAll('#langs button');
  for(var j = 0; j < bs.length; j++){ bs[j].setAttribute('aria-pressed', bs[j].getAttribute('data-l') === LANG ? 'true' : 'false'); }
  $('sdNote').textContent = T('sd_note');
  setStatus(S.status, S.statusExtra);
  try{ localStorage.setItem('kaiperEstacioLang', LANG); }catch(e){}
  render();
}

/* serial */
async function readLoop(port){
  var decoder = new TextDecoder(), buf = '';
  while(port.readable && S.port === port){
    var reader = port.readable.getReader(); S.reader = reader;
    try{
      while(true){
        var r = await reader.read();
        if(r.done) break;
        buf += decoder.decode(r.value, {stream:true});
        var parts = buf.split('\n'); buf = parts.pop();
        for(var i = 0; i < parts.length; i++) handleLine(parts[i]);
      }
    }catch(e){ if(S.port === port) setStatus('error', e.message); }
    finally{ reader.releaseLock(); }
  }
}
async function connect(){
  if(!('serial' in navigator)){ setStatus('unsupported'); return; }
  try{
    var port = await navigator.serial.requestPort();
    await port.open({baudRate:9600, dataBits:8, stopBits:1, parity:'none', flowControl:'none'});
    stopDemo();
    S.port = port; S.source = 'radio'; if(S.t0 === null) S.t0 = Date.now();
    $('sdNote').hidden = true;
    setStatus('live'); $('bConnect').textContent = T('disconnect');
    S.loop = readLoop(port);
  }catch(e){ if(e && e.name !== 'NotFoundError') setStatus('error', e.message); }
}
async function disconnect(){
  var p = S.port; S.port = null;
  try{ if(S.reader) await S.reader.cancel(); }catch(e){}
  try{ if(S.loop) await S.loop; }catch(e){}
  try{ if(p) await p.close(); }catch(e){}
  S.reader = null; S.loop = null;
  $('bConnect').textContent = T('connect'); setStatus('idle');
}

/* demo */
function startDemo(){
  if(S.port) return;
  if(S.t0 === null) S.t0 = Date.now();
  S.demo = setInterval(function(){
    var t = (Date.now() - S.t0) / 1000;
    var v = 24 + 3.5 * Math.sin(t / 9) - 0.04 * t + (Math.random() - 0.5) * 0.6;
    var line = v.toFixed(2) + ';';
    handleLine(line);
  }, 1000);
  $('bDemo').textContent = T('demo_stop'); setStatus('demo');
}
function stopDemo(){ if(S.demo){ clearInterval(S.demo); S.demo = null; $('bDemo').textContent = T('demo'); if(S.status === 'demo') setStatus('idle'); } }

/* SD file */
function loadSD(text){
  stopDemo();
  S.rows = []; S.raw = []; S.log = []; S.t0 = null; S.source = 'sd';
  var lines = text.split(/\r?\n/), c = colVal(), t = 0;
  for(var i = 0; i < lines.length; i++){
    var ln = lines[i].trim(); if(!ln) continue;
    S.raw.push(ln);
    var f = parseFrame(ln, c);
    if(!acceptFrame(f, teamVal())) S.log.push(ln); else { addSample(f.value, t); t += 1; }
  }
  $('sdNote').hidden = false; setStatus('sd'); render();
}

/* downloads */
function download(bytes, name, mime){
  var blob = new Blob([bytes], {type:mime}), a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function stamp(){ var d = new Date(), p = function(n){ return (n < 10 ? '0' : '') + n; }; return d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes()); }
function labels(){ return {sheet:T('x_sheet'), time:T('x_time'), temp:T('x_temp'), ma:T('x_ma'), count:T('x_count'), avg:T('x_avg'), min:T('x_min'), max:T('x_max'), last:T('x_last'), chart:T('x_chart')}; }

/* events */
$('bConnect').addEventListener('click', function(){ if(S.port) disconnect(); else connect(); });
$('bDemo').addEventListener('click', function(){ if(S.demo) stopDemo(); else startDemo(); });
$('bSD').addEventListener('click', function(){ $('fSD').click(); });
$('fSD').addEventListener('change', function(e){
  var f = e.target.files[0]; if(!f) return;
  if(S.rows.length && S.source !== 'sd' && !confirm(T('confirm_replace'))){ e.target.value = ''; return; }
  var rd = new FileReader(); rd.onload = function(){ loadSD(String(rd.result)); }; rd.readAsText(f); e.target.value = '';
});
$('bXlsx').addEventListener('click', function(){
  download(buildXlsx(S.rows, winVal(), labels()), 'kaiper_temperatura_' + stamp() + '.xlsx', 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
  S.dirty = false;
});
$('bRaw').addEventListener('click', function(){ download(S.raw.join('\r\n') + '\r\n', 'kaiper_registre_' + stamp() + '.txt', 'text/plain'); S.dirty = false; });
$('bClear').addEventListener('click', function(){ S.rows = []; S.raw = []; S.log = []; S.t0 = S.port || S.demo ? Date.now() : null; S.dirty = false; render(); });
['oWin','oCol','oTeam','oView'].forEach(function(id){ $(id).addEventListener('input', render); });
document.querySelectorAll('#langs button').forEach(function(b){ b.addEventListener('click', function(){ applyLang(b.getAttribute('data-l')); }); });
window.addEventListener('beforeunload', function(e){ if(S.dirty && S.rows.length){ e.preventDefault(); e.returnValue = T('leave_warn'); } });

var savedLang = null; try{ savedLang = localStorage.getItem('kaiperEstacioLang'); }catch(e){}
var urlLang = null; try{ urlLang = new URLSearchParams(location.search).get('lang'); }catch(e){}
applyLang(urlLang && I18N[urlLang] ? urlLang : (savedLang || 'ca'));
window.addEventListener('message', function(e){ var d = e.data; if(d && d.kaiperLang && I18N[d.kaiperLang]) applyLang(d.kaiperLang); });
if(window.self !== window.top) document.body.classList.add('embedded');
if(!('serial' in navigator)) setStatus('unsupported');
</script>
</body>
</html>
