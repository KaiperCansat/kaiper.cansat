<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estació de terra Kaiper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  :root{ --bg:#04060c; --navy:#0a1220; --deep:#0d1b2e; --ice:#8fd9e8; --ice-soft:#c9edf3; --foam:#eef8f8; --coral:#ff6f4d; --mint:#9be08f; --mute:#6f8a96; --line:rgba(143,217,232,0.16); --card:rgba(13,27,46,0.62); }
  *{ box-sizing:border-box; margin:0; padding:0; }
  [hidden]{ display:none !important; }
  html{ scroll-behavior:smooth; }
  body{ background:radial-gradient(900px 520px at 6% -4%,rgba(143,217,232,0.15),transparent 60%),radial-gradient(700px 520px at 100% 32%,rgba(255,111,77,0.07),transparent 60%),var(--bg); background-attachment:fixed; color:var(--foam); font-family:'Inter','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif; line-height:1.55; -webkit-font-smoothing:antialiased; }
  h1,h2,.kv{ font-family:'Space Grotesk','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif; }
  .nav{ position:sticky; top:0; z-index:20; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); background:rgba(4,6,12,0.72); border-bottom:1px solid var(--line); }
  .nav .in{ max-width:1180px; margin:0 auto; padding:0.7rem 5vw; display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap:0.6rem; font-family:'Space Grotesk',sans-serif; font-weight:700; letter-spacing:0.04em; }
  .brand img{ width:26px; height:26px; object-fit:contain; }
  .brand .tag{ font:600 0.66rem 'Inter',sans-serif; letter-spacing:0.18em; color:var(--ice); border:1px solid var(--line); border-radius:999px; padding:0.2rem 0.65rem; margin-left:0.4rem; text-transform:uppercase; }
  .langs button{ background:transparent; color:var(--ice-soft); border:1px solid var(--line); padding:0.3rem 0.65rem; border-radius:999px; cursor:pointer; font:500 0.8rem 'Inter',sans-serif; margin-left:0.3rem; }
  .langs button[aria-pressed="true"]{ color:var(--bg); background:var(--ice); border-color:var(--ice); }
  .wrap{ max-width:1180px; margin:0 auto; padding:0 5vw 4rem; }
  .hero{ padding:2.6rem 0 1.4rem; }
  .eyebrow{ font:600 0.72rem 'Inter',sans-serif; letter-spacing:0.22em; text-transform:uppercase; color:var(--ice); }
  h1{ font-size:clamp(2.4rem,7vw,4.4rem); line-height:1.02; font-weight:700; letter-spacing:-0.02em; margin-top:0.6rem; background:linear-gradient(120deg,#fff 30%,var(--ice)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub{ color:var(--ice-soft); max-width:620px; margin-top:0.8rem; font-size:1.02rem; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:1.1rem 1.2rem; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
  .ctrl{ display:flex; flex-wrap:wrap; gap:1rem 2rem; align-items:center; }
  .grp{ display:flex; flex-wrap:wrap; gap:0.5rem; align-items:center; }
  .gl{ font:600 0.68rem 'Inter',sans-serif; letter-spacing:0.18em; text-transform:uppercase; color:var(--mute); margin-right:0.3rem; }
  .btn{ display:inline-flex; align-items:center; gap:0.4rem; background:rgba(255,255,255,0.03); color:var(--foam); border:1px solid var(--line); border-radius:10px; padding:0.55rem 0.95rem; cursor:pointer; font:500 0.88rem 'Inter',sans-serif; text-decoration:none; transition:border-color .15s, background .15s; }
  .btn:hover{ border-color:var(--ice); background:rgba(143,217,232,0.08); }
  .btn.main{ background:var(--coral); border-color:var(--coral); color:#1a0b06; font-weight:600; }
  .btn.ext::after{ content:'↗'; opacity:0.7; }
  .btn.off, .btn[disabled]{ opacity:0.35; pointer-events:none; cursor:not-allowed; }
  .status{ width:100%; display:flex; align-items:center; flex-wrap:wrap; gap:0.55rem; font-size:0.88rem; color:var(--ice-soft); padding-top:0.9rem; border-top:1px solid var(--line); }
  .dot{ width:10px; height:10px; border-radius:50%; background:#6f8a96; flex:none; }
  .dot.live{ background:#39ff6a; box-shadow:0 0 8px #39ff6a; }
  .dot.err{ background:var(--coral); }
  .dot.hit{ animation:hit .6s ease-out; }
  @keyframes hit{ 0%{ box-shadow:0 0 0 0 rgba(57,255,106,0.9); } 100%{ box-shadow:0 0 0 12px rgba(57,255,106,0); } }
  .age{ margin-left:auto; font-size:0.8rem; color:var(--mute); font-variant-numeric:tabular-nums; }
  .age.stale{ color:var(--coral); }
  .sec{ margin-top:3rem; }
  .sec h2{ font-size:clamp(1.4rem,3vw,1.9rem); font-weight:600; margin:0.3rem 0 1rem; }
  .kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:0.8rem; }
  .kpi{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:0.9rem 1rem 0.7rem; }
  .kl{ font-size:0.72rem; letter-spacing:0.07em; text-transform:uppercase; color:var(--ice-soft); }
  .kv{ display:flex; align-items:baseline; gap:0.35rem; margin-top:0.15rem; font-size:2.1rem; font-weight:600; font-variant-numeric:tabular-nums; }
  .kv small{ font-size:0.85rem; color:var(--mute); font-weight:500; }
  .kpi svg{ width:100%; height:28px; margin-top:0.4rem; display:block; }
  .pills{ display:flex; flex-wrap:wrap; gap:0.4rem; margin-bottom:0.9rem; }
  .pill{ background:transparent; color:var(--ice-soft); border:1px solid var(--line); border-radius:999px; padding:0.35rem 0.85rem; cursor:pointer; font:500 0.82rem 'Inter',sans-serif; }
  .pill:hover{ border-color:var(--ice); }
  .pill.on{ background:var(--ice); color:var(--bg); border-color:var(--ice); font-weight:600; }
  .chartbox svg, #track svg{ width:100%; height:auto; display:block; }
  .legend{ display:flex; flex-wrap:wrap; gap:1.2rem; font-size:0.82rem; color:var(--ice-soft); margin-top:0.4rem; }
  .legend i{ display:inline-block; width:18px; height:3px; margin-right:0.45rem; vertical-align:middle; border-radius:2px; }
  .opts{ display:flex; flex-wrap:wrap; gap:1.4rem; margin-top:1rem; font-size:0.85rem; color:var(--ice-soft); align-items:center; }
  .opts input, .opts select{ background:var(--deep); color:var(--foam); border:1px solid var(--line); border-radius:8px; padding:0.3rem 0.5rem; font:inherit; width:4.4rem; }
  .opts select{ width:auto; max-width:100%; }
  .maphead{ display:flex; flex-wrap:wrap; gap:0.5rem; align-items:center; }
  .segs{ display:inline-flex; margin-right:0.6rem; }
  .seg{ background:transparent; border:1px solid var(--line); color:var(--ice-soft); padding:0.5rem 0.9rem; cursor:pointer; font:500 0.85rem 'Inter',sans-serif; }
  .seg:first-child{ border-radius:10px 0 0 10px; } .seg:last-child{ border-radius:0 10px 10px 0; border-left:0; }
  .seg.on{ background:var(--ice); color:var(--bg); border-color:var(--ice); font-weight:600; }
  .mapgrid{ display:grid; grid-template-columns:1.3fr 1fr; gap:1rem; margin-top:1rem; }
  @media (max-width:860px){ .mapgrid, .cols{ grid-template-columns:1fr !important; } }
  .mapframe{ position:relative; min-height:400px; border-radius:12px; overflow:hidden; border:1px solid var(--line); background:var(--deep); }
  .mapframe #gmap{ position:absolute; inset:0; background:var(--deep); }
  .leaflet-container{ font-family:inherit; }
  .btn.on{ background:var(--ice); color:var(--bg); border-color:var(--ice); font-weight:600; }
  .mapph{ z-index:1000; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:1rem; color:var(--mute); }
  .geo{ display:flex; gap:1rem; align-items:center; margin-top:0.8rem; }
  .geol{ flex:1; display:grid; grid-template-columns:1fr 1fr; gap:0.5rem 0.9rem; font-size:0.85rem; }
  .geol div{ display:flex; flex-direction:column; }
  .geol span{ color:var(--mute); font-size:0.7rem; text-transform:uppercase; letter-spacing:0.05em; }
  .geol b{ font-weight:600; font-variant-numeric:tabular-nums; }
  .mapnote{ margin-top:0.7rem; font-size:0.78rem; color:var(--mute); }
  .cols{ display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
  .card h3{ font:600 0.95rem 'Space Grotesk',sans-serif; margin-bottom:0.7rem; }
  table{ width:100%; border-collapse:collapse; font-size:0.85rem; }
  th,td{ text-align:left; padding:0.4rem 0.4rem; border-bottom:1px solid var(--line); }
  td+td,th+th{ text-align:right; font-variant-numeric:tabular-nums; }
  th{ color:var(--mute); font-weight:500; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.06em; }
  .scroll{ max-height:300px; overflow:auto; }
  .logline{ font-family:ui-monospace,Menlo,Consolas,monospace; font-size:0.78rem; color:var(--ice-soft); padding:0.2rem 0; border-bottom:1px solid var(--line); word-break:break-word; }
  .empty{ color:var(--mute); font-size:0.85rem; }
  .info{ font-size:0.8rem; color:var(--mute); margin-top:0.6rem; }
  .tips{ margin-top:2.4rem; border-left:3px solid var(--coral); padding:0.5rem 1.1rem; color:var(--ice-soft); font-size:0.88rem; }
  .tips strong{ color:var(--foam); }
  .tips li{ margin-left:1.1rem; margin-top:0.3rem; }
  .note{ margin-top:0.6rem; font-size:0.8rem; color:var(--mute); }
  body.embedded .nav, body.embedded .hero{ display:none; }
  body.embedded .wrap{ padding-top:1rem; }
</style>
</head>
<body>
<header class="nav"><div class="in">
  <div class="brand"><img src="images/isotipo-small.png" alt="" onerror="this.style.display='none'">KAIPER<span class="tag" data-i="app"></span></div>
  <div class="langs" id="langs">
    <button type="button" data-l="ca">CA</button><button type="button" data-l="es">ES</button><button type="button" data-l="en">EN</button><button type="button" data-l="zh">中文</button>
  </div>
</div></header>

<main class="wrap">
  <section class="hero">
    <p class="eyebrow" data-i="eyebrow"></p>
    <h1 data-i="title"></h1>
    <p class="sub" data-i="sub"></p>
  </section>

  <section class="card ctrl">
    <div class="grp"><span class="gl" data-i="g_conn"></span>
      <button class="btn main" id="bConnect" type="button"></button>
      <button class="btn" id="bDemo" type="button"></button>
      <button class="btn" id="bSD" type="button" data-i="open_sd"></button>
      <input type="file" id="fSD" accept=".txt,.csv,text/plain" hidden>
    </div>
    <div class="grp"><span class="gl" data-i="g_data"></span>
      <button class="btn" id="bXlsx" type="button" data-i="dl_xlsx" disabled></button>
      <button class="btn" id="bRaw" type="button" data-i="dl_raw" disabled></button>
      <button class="btn" id="bClear" type="button" data-i="clear" disabled></button>
    </div>
    <div class="status"><span class="dot" id="dot"></span><span id="statusTxt"></span><span class="age" id="age"></span></div>
  </section>

  <section class="sec">
    <p class="eyebrow">01</p><h2 data-i="s1"></h2>
    <div class="kpis" id="kpis"></div>
  </section>

  <section class="sec">
    <p class="eyebrow">02</p><h2 data-i="s2"></h2>
    <div class="pills" id="pills"></div>
    <div class="card chartbox">
      <div id="chart"></div>
      <div class="legend" id="legend"></div>
      <div class="opts">
        <label><span data-i="opt_window"></span> <input type="number" id="oWin" min="2" max="100" value="10"></label>
        <label><span data-i="opt_team"></span> <input type="text" id="oTeam" maxlength="8" placeholder="KAI" style="width:5.5rem"></label>
        <label><span data-i="opt_view"></span> <select id="oView"><option value="all" data-i="view_all"></option><option value="60" data-i="view_60"></option></select></label>
      </div>
    </div>
  </section>

  <section class="sec">
    <p class="eyebrow">03</p><h2 data-i="s3"></h2>
    <div class="card">
      <div class="maphead">
        <div class="segs"><button class="seg on" id="bMapSat" type="button" data-i="map_sat"></button><button class="seg" id="bMapRoad" type="button" data-i="map_road"></button></div>
        <a class="btn ext off" id="aGmaps" target="_blank" rel="noopener" data-i="b_gmaps"></a>
        <a class="btn ext off" id="aEarth" target="_blank" rel="noopener" data-i="b_earth"></a>
        <a class="btn ext off" id="aDir" target="_blank" rel="noopener" data-i="b_dir"></a>
        <button class="btn on" id="bFollow" type="button" data-i="b_follow"></button>
        <button class="btn" id="bKml" type="button" data-i="b_kml" disabled></button>
      </div>
      <div class="mapgrid">
        <div class="mapframe"><div id="gmap"></div><div class="mapph" id="mapPh" data-i="map_wait"></div></div>
        <div><div id="track"></div><div id="geo"></div></div>
      </div>
      <p class="mapnote" data-i="map_note"></p>
    </div>
  </section>

  <section class="sec">
    <p class="eyebrow">04</p><h2 data-i="s4"></h2>
    <div class="cols">
      <div class="card"><h3 data-i="sum_title"></h3><div class="scroll"><table>
        <thead><tr><th data-i="c_ch"></th><th data-i="c_last"></th><th data-i="c_avg"></th><th data-i="c_min"></th><th data-i="c_max"></th></tr></thead>
        <tbody id="sumBody"></tbody></table></div><div class="info" id="count"></div></div>
      <div class="card"><h3 data-i="log_title"></h3><div class="scroll" id="log"></div></div>
    </div>
  </section>

  <div class="tips">
    <strong data-i="tip_title"></strong>
    <ul><li data-i="tip1"></li><li data-i="tip2"></li><li data-i="tip3"></li><li data-i="tip4"></li><li data-i="tip5"></li></ul>
  </div>
  <p class="note" id="sdNote" hidden></p>
</main>

    g += '<text x="'+xx+'" y="'+(Tp+ph+18)+'" fill="#c9edf3" font-size="12" text-anchor="middle" font-family="Inter,sans-serif">'+(Math.round(xv*10)/10)+'</text>';
  }

    g += '<circle cx="'+X(lq.t).toFixed(1)+'" cy="'+Y(lq.v).toFixed(1)+'" r="4.5" fill="#ff6f4d"/>';

}

  while(port.readable && S.port === port){
    var reader = port.readable.getReader(); S.reader = reader;
    try{
      while(true){
        var r = await reader.read();
        if(r.done) break;
        buf += decoder.decode(r.value, {stream:true});
        var parts = buf.split('\n'); buf = parts.pop();
        for(var i = 0; i < parts.length; i++) handleLine(parts[i]);
      }
    }catch(e){ if(S.port === port) setStatus('error', e.message); }
    finally{ reader.releaseLock(); }
  }
}
async function connect(){
  if(!('serial' in navigator)){ setStatus('unsupported'); return; }
  try{
    var port = await navigator.serial.requestPort();
    await port.open({baudRate:9600, dataBits:8, stopBits:1, parity:'none', flowControl:'none'});
    stopDemo();
    S.port = port; S.source = 'radio'; if(S.t0 === null) S.t0 = Date.now();
    $('sdNote').hidden = true;
    setStatus('live'); $('bConnect').textContent = T('disconnect');
    S.loop = readLoop(port);
  }catch(e){ if(e && e.name !== 'NotFoundError') setStatus('error', e.message); }
}
async function disconnect(){
  var p = S.port; S.port = null;
  try{ if(S.reader) await S.reader.cancel(); }catch(e){}
  try{ if(S.loop) await S.loop; }catch(e){}
  try{ if(p) await p.close(); }catch(e){}
  S.reader = null; S.loop = null;
  $('bConnect').textContent = T('connect'); setStatus('idle');
}

/* demo: a made-up flight, full 16-value frame */
function startDemo(){
  if(S.port) return;
  if(S.t0 === null) S.t0 = Date.now();
  S.demo = setInterval(function(){
    var t = (Date.now() - S.t0) / 1000, d = new Date();
    function z(n){ return (n < 10 ? '0' : '') + n; }
    function r(a){ return (Math.random() - 0.5) * a; }
    var alt = 350 * (1 - Math.cos(t / 60)), ta = 24 - alt * 0.0065 + r(0.6);
    var v = [ta, ta + 0.3 + r(0.4), 1013.25 * Math.exp(-alt / 8400), alt + r(1), ta - 0.6 + r(0.4), 50 + alt * 0.01 + r(2)];
    var date = d.getDate() + '/' + (d.getMonth() + 1) + '/' + d.getFullYear(), time = z(d.getHours()) + ':' + z(d.getMinutes()) + ':' + z(d.getSeconds());
    var out = [teamVal() || 'KAI', v[0].toFixed(2), v[1].toFixed(2), v[2].toFixed(2), v[3].toFixed(2), v[4].toFixed(2), v[5].toFixed(2), date, time,
      (41.6 + t * 0.00001 + 0.0003 * Math.sin(t / 20)).toFixed(5), (2.2 + t * 0.000015).toFixed(5), (alt + 3).toFixed(2), Math.round(60 + 30 * Math.sin(t / 30)), (20 + 15 * Math.sin(t / 25)).toFixed(2), 8, date, time];
    handleLine(out.join(';') + ';');
  }, 1000);
  $('bDemo').textContent = T('demo_stop'); setStatus('demo');
}
function stopDemo(){ if(S.demo){ clearInterval(S.demo); S.demo = null; $('bDemo').textContent = T('demo'); if(S.status === 'demo') setStatus('idle'); } }

/* SD file */
function loadSD(text){
  stopDemo();
  S.rows = []; S.raw = []; S.log = []; S.t0 = null; S.source = 'sd';
  var lines = text.split(/\r?\n/), t = 0;
  for(var i = 0; i < lines.length; i++){
    var ln = lines[i].trim(); if(!ln) continue;
    S.raw.push(ln);
    var p = parseFrame(ln);
    if(!acceptFrame(p, teamVal())) S.log.push(ln); else { S.rows.push({t:t, f:p.f}); S.dirty = true; t += 1; }
  }
  $('sdNote').hidden = false; setStatus('sd'); render();
}

/* downloads */
function download(bytes, name, mime){
  var blob = new Blob([bytes], {type:mime}), a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function stamp(){ var d = new Date(), p = function(n){ return (n < 10 ? '0' : '') + n; }; return d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes()); }

/* events */
$('bConnect').addEventListener('click', function(){ if(S.port) disconnect(); else connect(); });
$('bDemo').addEventListener('click', function(){ if(S.demo) stopDemo(); else startDemo(); });
$('bSD').addEventListener('click', function(){ $('fSD').click(); });
$('fSD').addEventListener('change', function(e){
  var f = e.target.files[0]; if(!f) return;
  if(S.rows.length && S.source !== 'sd' && !confirm(T('confirm_replace'))){ e.target.value = ''; return; }
  var rd = new FileReader(); rd.onload = function(){ loadSD(String(rd.result)); }; rd.readAsText(f); e.target.value = '';
});
$('bXlsx').addEventListener('click', function(){
  download(buildXlsx(S.rows), 'kaiper_dades_' + stamp() + '.xlsx', 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
  S.dirty = false;
});
$('bRaw').addEventListener('click', function(){ download(S.raw.join('\r\n') + '\r\n', 'kaiper_registre_' + stamp() + '.txt', 'text/plain'); S.dirty = false; });
$('bClear').addEventListener('click', function(){ S.rows = []; S.raw = []; S.log = []; S.t0 = (S.port || S.demo) ? Date.now() : null; S.dirty = false; render(); });
['oWin','oTeam','oView'].forEach(function(id){ $(id).addEventListener('input', render); });
document.querySelectorAll('#langs button').forEach(function(b){ b.addEventListener('click', function(){ applyLang(b.getAttribute('data-l')); }); });
window.addEventListener('beforeunload', function(e){ if(S.dirty && S.rows.length){ e.preventDefault(); e.returnValue = T('leave_warn'); } });

$('pills').addEventListener('click', function(e){ var c = e.target.getAttribute && e.target.getAttribute('data-c'); if(c){ S.chan = c; render(); } });
function setMapType(t){ S.mapType = t; $('bMapSat').classList.toggle('on', t === 'k'); $('bMapRoad').classList.toggle('on', t === 'm'); applyMapType(); }
$('bFollow').addEventListener('click', function(){ S.follow = !S.follow; syncFollow(); var f = lastFix(); if(S.follow && f && MAP) MAP.panTo([f.lat, f.lon], {animate:true}); });
$('bMapSat').addEventListener('click', function(){ setMapType('k'); });
$('bMapRoad').addEventListener('click', function(){ setMapType('m'); });
$('bKml').addEventListener('click', function(){ var k = buildKml(); if(k) download(k, 'kaiper_trajectoria_' + stamp() + '.kml', 'application/vnd.google-earth.kml+xml'); });
setInterval(function(){
  var a = $('age');
  if(!S.lastRx){ a.textContent = ''; return; }
  var n = Math.round((Date.now() - S.lastRx) / 1000);
  a.textContent = T('age').replace('{n}', n);
  a.className = 'age' + ((S.port || S.demo) && n > 10 ? ' stale' : '');
}, 1000);

var savedLang = null; try{ savedLang = localStorage.getItem('kaiperEstacioLang'); }catch(e){}
var urlLang = null; try{ urlLang = new URLSearchParams(location.search).get('lang'); }catch(e){}
applyLang(urlLang && I18N[urlLang] ? urlLang : (savedLang || 'ca'));
window.addEventListener('message', function(e){ var d = e.data; if(d && d.kaiperLang && I18N[d.kaiperLang]) applyLang(d.kaiperLang); });
if(window.self !== window.top) document.body.classList.add('embedded');
if(!('serial' in navigator)) setStatus('unsupported');
</script>
